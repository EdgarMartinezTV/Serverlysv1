# External uptime check. Runs OFF the server on purpose: a monitor on the same
# machine goes down with the thing it is watching.
#
# A failed run makes GitHub email the account that last edited this schedule.
# GitHub may delay scheduled runs by a few minutes under load, and pauses them
# after 60 days without repository activity; re-enable from the Actions tab.
name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  # Switch to https://serverlys.com at DNS cutover.
  SITE: https://webhosting-serverlys.rf90qw.easypanel.host

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health probe and homepage
        run: |
          # Three attempts, 20s apart, so one dropped packet is not an alert.
          for attempt in 1 2 3; do
            health=$(curl -fsS --max-time 15 "$SITE/api/health" || true)
            home=$(curl -fsS --max-time 15 "$SITE/" || true)
            # The homepage must be the real site, not Easypanel's
            # "Service is not started" page or a proxy error page.
            if echo "$health" | grep -q '"ok":true' && echo "$home" | grep -q "Serverlys"; then
              echo "up (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt failed"
            sleep 20
          done
          echo "::error::$SITE is down: health probe or homepage failed 3 times"
          exit 1
